name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run market data unit tests
        run: python -m unittest discover -s tests -v

      - name: Check live public BTC price endpoint
        run: |
          python -c 'from exchange.market_data import fetch_current_price; price = fetch_current_price("BTC/USDT"); print(f"Live BTC/USDT price: {price:,.2f} USDT")'
