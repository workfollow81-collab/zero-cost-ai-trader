name: Paper Trading Bot

on:
  # cron-job.org triggers this workflow every 5 minutes.
  workflow_dispatch:

# Prevent overlapping runs from accessing the same cached paper state.
concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Restore the latest saved virtual portfolio state.
      - name: Restore paper-trading state
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-paper-state-

      - name: Install bot dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Run one paper-trading cycle
        run: python main.py --once

      - name: Export dashboard data
        run: python dashboard/export_public_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
