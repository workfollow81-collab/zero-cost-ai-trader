name: Paper Trading Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# امنع تشغيل نسختين معاً حتى لا تتعارض قاعدة البيانات المحفوظة.
concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # كل تشغيل يسترجع أحدث نسخة محفوظة من قاعدة بيانات المحاكاة.
      # يُنشأ مفتاح جديد في كل مرة كي تُحفظ الحالة المحدّثة كنسخة جديدة.
      - name: Restore paper-trading state
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-paper-state-

      - name: Install bot dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Run one paper-trading cycle
        run: python main.py --once
