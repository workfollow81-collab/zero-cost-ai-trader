name: Paper Trading Bot

on:
  # cron-job.org triggers this workflow every 5 minutes.
  workflow_dispatch:

# Prevent overlapping runs from accessing the same cached paper/MT5 state.
concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  paper-trading:
    # MT5's official Python integration requires the Windows terminal.
    # Public-repository standard GitHub-hosted Windows runners are free.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_DEMO_TRADING_ENABLED: ${{ secrets.MT5_DEMO_TRADING_ENABLED }}
      MT5_SYMBOL: ${{ secrets.MT5_SYMBOL }}
      MT5_VOLUME: "0.1"
      MT5_MAX_SPREAD_POINTS: ${{ secrets.MT5_MAX_SPREAD_POINTS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Restore the latest saved virtual portfolio and MT5 duplicate-bar state.
      - name: Restore trading state
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-paper-state-

      - name: Validate MT5 bridge syntax
        run: python -m py_compile mt5_demo.py

      - name: Install MetaTrader 5 terminal (demo mode only)
        if: ${{ env.MT5_DEMO_TRADING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $uri = "https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe?utm_campaign=download&utm_source=www.metatrader5.com"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait
          $terminal = Join-Path $env:ProgramFiles "MetaTrader 5\terminal64.exe"
          if (!(Test-Path $terminal)) {
            throw "MetaTrader 5 terminal64.exe was not found after installation."
          }
          "MT5_TERMINAL_PATH=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install bot dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pandas numpy
          if ($env:MT5_DEMO_TRADING_ENABLED -eq "true") {
            python -m pip install MetaTrader5
          }
          python -m pip install pytest

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run one paper-trading cycle
        run: python main.py --once

      - name: Export dashboard data
        run: python dashboard/export_public_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run MetaQuotes-Demo execution cycle
        if: ${{ env.MT5_DEMO_TRADING_ENABLED == 'true' }}
        run: python mt5_demo.py


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
